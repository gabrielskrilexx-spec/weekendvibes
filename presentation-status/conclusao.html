<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container { 
            width: 1280px; 
            min-height: 720px; 
            background: #FFFFFF; 
            color: #1A1C20; 
            font-family: "Courier New", monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .signal-block {
            width: 120px;
            height: 120px;
            background: #0047FF;
            margin-bottom: 60px;
        }
        .title {
            font-size: 72px;
            font-weight: 700;
            letter-spacing: -4px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .subtitle {
            font-size: 28px;
            line-height: 1.4;
            max-width: 900px;
            color: #4c4f55;
        }
        .accent {
            color: #0047FF;
            font-weight: 700;
        }
        .footer {
            position: absolute;
            bottom: 60px;
            font-size: 14px;
            letter-spacing: 2px;
            font-weight: 700;
            border-top: 2px solid #1A1C20;
            padding-top: 20px;
            width: 1120px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="signal-block"></div>
        <h1 class="title">Conclusão</h1>
        <p class="subtitle">
            Operação preparada para <span class="accent">diagnóstico seguro</span> e evolução contínua.<br>
            Dry-run, auditoria e resiliência agora trabalham no mesmo fluxo.
        </p>
        <div class="footer">
            WEEKENDVIBES / RELATÓRIO DE STATUS OPERACIONAL / 2026.08.25
        </div>
    </div>
</body>
</html>
